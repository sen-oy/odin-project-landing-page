<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
    <div class="header">
        <p id="header-logo">Header Logo</p>
        <ul id="header-links">
            <li class="header-link">header link one</li>
            <li class="header-link">header link two</li>
            <li class="header-link">header link three</li>
        </ul>
    </div>
    <div class="hero">
        <div id="hero-text"></div>
        <div id="hero-image"></div>
    </div>
    <div class="information">
        <p>Some random information</p>
        <div id="information-boxes">
            <div class="information-box"></div>
            <div class="information-box"></div>
            <div class="information-box"></div>
            <div class="information-box"></div>
        </div>
    </div>
    <div class="quote">
        <p id="quote-text"></p>
        <p id="quote-person"></p>
    </div>
    <div class="call-to-action">
        <div id="cta-inner-box">
            <div id="cta-text"></div>
            <button id="cta-sign-up-btn"></button>
        </div>
    </div>
    <div class="footer">
        <p id="footer-text">Copyright The Odin Project 2026</p>
    </div>
</body>
</html>
